  (() => {
    const media = window.matchMedia('(prefers-color-scheme: dark)');
    const DAY = 24 * 60 * 60 * 1000;
    // localStorage 可能被浏览器禁用，读写都包一层 try
    const store = (fn) => {
      try {
        return fn(localStorage);
      } catch {
        return undefined;
      }
    };
    const readSaved = () =>
      store((s) => {
        const theme = s.getItem('theme');
        const ts = Number(s.getItem('themeSetTimestamp'));
        if ((theme === 'dark' || theme === 'light') && ts > 0) return { theme, ts };
      });
    let manual = readSaved();

    // 当前应使用的主题：24 小时内的手动选择优先，否则跟随系统
    const preferred = () => {
      if (manual && Date.now() - manual.ts < DAY) return manual.theme;
      if (manual) {
        manual = undefined;
        store((s) => {
          s.removeItem('theme');
          s.removeItem('themeSetTimestamp');
        });
      }
      return media.matches ? 'dark' : 'light';
    };
    const reflect = () => {
      const theme = preferred();
      document.documentElement.setAttribute('data-theme', theme);
      document.querySelector('#theme-btn')?.setAttribute('aria-label', theme === 'dark' ? '深色' : '浅色');
      document.querySelector('meta[name="theme-color"]')?.setAttribute('content', theme === 'dark' ? '#212737' : '#fdfdfd');
      if (document.body) document.body.style.colorScheme = theme;
    };
    reflect();

    window.addEventListener('DOMContentLoaded', () => {
      reflect();
      document.querySelector('#theme-btn')?.addEventListener('click', () => {
        manual = { theme: preferred() === 'light' ? 'dark' : 'light', ts: Date.now() };
        store((s) => {
          s.setItem('theme', manual.theme);
          s.setItem('themeSetTimestamp', String(manual.ts));
        });
        if (document.startViewTransition) document.startViewTransition(reflect);
        else reflect();
      });
    });
    media.addEventListener('change', reflect);
    // 其他标签页切换了主题，这里同步
    window.addEventListener('storage', (e) => {
      if (e.key === null || e.key === 'theme' || e.key === 'themeSetTimestamp') {
        manual = readSaved();
        reflect();
      }
    });
  })();
